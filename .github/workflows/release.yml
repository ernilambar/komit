name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# A re-pushed tag must not leave two release runs racing to publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # komit targets macOS 15+ on Apple Silicon.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p build dist
          go build -trimpath -ldflags="-s -w -macos 15.0 -X main.version=${{ github.ref_name }}" -o build/komit .

      - name: Verify architecture
        run: |
          info="$(file build/komit)"
          echo "$info"
          if ! grep -q 'Mach-O 64-bit' <<<"$info" || ! grep -qw 'arm64' <<<"$info"; then
            echo "::error::expected a Mach-O arm64 executable"
            exit 1
          fi

      # A tarball keeps the executable bit, which a bare download loses.
      # The unversioned copy backs the stable releases/latest/download URL.
      - name: Package
        run: |
          tar -czf dist/komit-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz -C build komit
          cp dist/komit-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz dist/komit-${{ matrix.suffix }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: komit-${{ matrix.suffix }}
          path: dist/*

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # Gate publishing on the "release" environment so a tag can require approval.
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve diff URL
        id: diff
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${GITHUB_REF_NAME}"
          else
            URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum komit-*.tar.gz > SHA256SUMS

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: ${{ steps.diff.outputs.url }}
          generate_release_notes: false
